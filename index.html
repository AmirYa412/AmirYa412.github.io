<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Amir Yamin — Resume | Senior Test Automation Engineer</title>
  <meta name="description" content="Résumé of Amir Yamin, Senior Test Automation Engineer.">
  <meta name="author" content="Amir Yamin">
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #0f172a;
      --panel: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --brand: #2563eb;
      --brand-ink: #ffffff;
      --border: #e2e8f0;
      --ring: rgba(37, 99, 235, 0.35);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 50% -10%, #1e293b 0%, var(--bg) 60%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 20px 48px;
      line-height: 1.5;
    }
    .card {
      width: 100%;
      max-width: 860px;
      background: var(--panel);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(2, 6, 23, 0.35);
      overflow: hidden;
    }
    header {
      padding: 40px 32px 28px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 12px;
      font-weight: 700;
      color: var(--brand);
      margin: 0 0 12px;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 40px);
      letter-spacing: -0.02em;
    }
    .role {
      margin: 8px 0 0;
      font-size: clamp(15px, 3.5vw, 18px);
      color: var(--muted);
      font-weight: 500;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      padding: 24px 32px;
    }
    .btn {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      padding: 12px 22px;
      border-radius: 10px;
      border: 1px solid var(--border);
      color: var(--ink);
      background: #f8fafc;
      transition: transform 0.05s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    .btn:hover { background: #eef2f7; }
    .btn:active { transform: translateY(1px); }
    .btn:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
    .btn.primary {
      background: var(--brand);
      border-color: var(--brand);
      color: var(--brand-ink);
    }
    .btn.primary:hover { background: #1d4ed8; }
    .viewer {
      padding: 0 20px 20px;
    }
    .viewer object,
    .viewer iframe {
      width: 100%;
      height: 78vh;
      min-height: 480px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #f1f5f9;
    }
    .fallback {
      padding: 28px;
      text-align: center;
      color: var(--muted);
    }
    .fallback a { color: var(--brand); font-weight: 600; }
    footer {
      color: #94a3b8;
      font-size: 13px;
      margin-top: 22px;
      text-align: center;
    }
    @media (max-width: 520px) {
      .viewer object, .viewer iframe { height: 68vh; }
    }
  </style>
</head>
<body>
  <main class="card">
    <header>
      <p class="eyebrow">Resume</p>
      <h1>Amir Yamin</h1>
      <p class="role">Senior Test Automation Engineer</p>
    </header>

    <div class="actions">
      <a class="btn primary" href="resume.pdf" target="_blank" rel="noopener">View Resume</a>
      <a class="btn" href="resume.pdf" download="Amir-Yamin-Resume.pdf">Download PDF</a>
    </div>

    <section class="viewer" aria-label="Resume preview">
      <object data="resume.pdf" type="application/pdf" aria-label="Amir Yamin resume PDF">
        <div class="fallback">
          <p>Your browser can't display the PDF inline.</p>
          <p>
            <a href="resume.pdf" target="_blank" rel="noopener">Open the resume in a new tab</a>
            &nbsp;·&nbsp;
            <a href="resume.pdf" download="Amir-Yamin-Resume.pdf">Download the PDF</a>
          </p>
        </div>
      </object>
    </section>
  </main>

  <footer>Amir Yamin · Resume</footer>
</body>
</html>
